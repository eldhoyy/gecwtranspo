name: Fix Thalapuzha UI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-thalapuzha-ui.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore previous full UI and rename quick routes
        run: |
          git checkout 300828c04ed71983d8095dd7cd55e1a654780aeb -- app/page.tsx
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          s = s.replace('from: "GECW",\n    to: "MANANTHAVADY",\n    subtitle: "GECW Campus Route",', 'from: "THALAPUZHA",\n    to: "MANANTHAVADY",\n    subtitle: "Campus Route",')
          s = s.replace('from: "GECW",\n    to: "KANNUR",', 'from: "THALAPUZHA",\n    to: "KANNUR",')
          s = s.replace('from: "GECW",\n    to: "THALASSERY",', 'from: "THALAPUZHA",\n    to: "THALASSERY",')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Restore full UI and use THALAPUZHA in quick routes" || exit 0
          git push origin main
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-thalapuzha-ui.yml
          git commit -m "Remove temporary UI fix workflow"
          git push origin main
